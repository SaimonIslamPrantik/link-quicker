<script>
  // --- GTA Loading Screen Slide Cycling ---
  const slides = document.querySelectorAll('.gta-slide');
  let currentSlide = 0;

  setInterval(() => {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
  }, 4000);

  // --- Supabase Redirect Handler ---
  const SUPABASE_URL = 'BUILD_ENV_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'BUILD_ENV_SUPABASE_ANON_KEY';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function handleRedirect() {
    const path = window.location.pathname;
    const slug = path.substring(1).replace(/\/$/, '');

    if (!slug) {
      window.location.href = '/';
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('urls')
        .select('destination_url')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        showError('404 - LINK NOT FOUND', 'The requested link has expired or does not exist in Liberty City.');
        return;
      }

      // 1-second artificial delay to allow the GTA loading screen experience before redirecting
      setTimeout(() => {
        window.location.replace(data.destination_url);
      }, 1000);

    } catch (err) {
      showError('SYSTEM ERROR', 'Failed to establish connection with Supabase database.');
    }
  }

  function showError(title, desc) {
    document.getElementById('gtaContainer').classList.add('error-mode');
    document.getElementById('statusTitle').innerText = title;
    document.getElementById('statusDesc').innerText = desc;
  }

  handleRedirect();
</script>
